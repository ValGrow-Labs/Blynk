plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Google Maps API key, resolved in order: environment variable MAPS_API_KEY,
// android/secrets.properties, android/local.properties, else empty. Never
// printed and never committed; an empty key must not fail the build.
def mapsApiKey = {
    def fromEnv = System.getenv("MAPS_API_KEY")
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    for (fileName in ["secrets.properties", "local.properties"]) {
        def propsFile = rootProject.file(fileName)
        if (propsFile.exists()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            def value = props.getProperty("MAPS_API_KEY")
            if (value != null && !value.trim().isEmpty()) return value.trim()
        }
    }
    return ""
}.call()
if (mapsApiKey.isEmpty()) {
    logger.warn("MAPS_API_KEY is not set: Google Maps will show an unavailable/blank map")
}

android {
    namespace = "dev.sarthakag.blinkit.ecom"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "dev.sarthakag.blinkit.ecom"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
